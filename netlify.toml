[build.environment]
NODE_VERSION = "24.19.0"
NPM_VERSION = "11.17.0"
TZ = "Asia/Jakarta"

[build]
publish = "website/dist"
command = """\
  git config core.quotepath false && \
  cd website && pnpm install --frozen-lockfile && \
  NODE_ENV=production pnpm run build && cd .. && \
  cp ./schemas/*.json ./website/dist/ && \
  cp ./scripts/install.sh ./website/dist/ && \
  cp ./scripts/install.ps1 ./website/dist/
  """

[[redirects]]
from = "/docs"
to = "/docs/start/overview"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/404/"
status = 404
