[workspace]
resolver = "2"
members = ["crates/coding-agent", "crates/elph-agent", "crates/elph-ai", "crates/floppy", "crates/rendown"]
exclude = ["crates/control-plane", "crates/elph-cron", "crates/elph-sandbox", "vendor/iocraft"]

[workspace.package]
homepage = "https://elph.space"
repository = "https://github.com/riipandi/elph"
rust-version = "1.97"
edition = "2024"

[workspace.lints.rust]
linker_messages = "allow"

[workspace.dependencies]
aes-gcm = "0.11.1"
agent-client-protocol = { version = "2.0.0", features = [
  "unstable_protocol_v2",
  "unstable_elicitation",
  "unstable_auth_methods",
] }
anstyle = "1.0.14"
anstyle-syntect = "1.0.5"
anyhow = "1.0.104"
aws-config = "1.11.0"
aws-sdk-bedrockruntime = "1.142.0"
aws-smithy-runtime-api = "1.15.0"
aws-smithy-types = "1.6.2"
ast-grep-core = "0.45.2"
ast-grep-language = { version = "0.45.2", default-features = false, features = [
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-c-sharp",
  "tree-sitter-elixir",
  "tree-sitter-go",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
] }
astral-tl = "0.7.11"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
backon = "1.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive", "usage"] }
clap_complete = "4.6.9"
clipboard-rs = "0.3.5"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
dotenvy = "0.15.7"
elph-agent = { path = "crates/elph-agent", version = "0.0.28" }
elph-ai = { path = "crates/elph-ai", version = "0.0.28" }
elph-tui = { path = "crates/elph-tui", version = "0.0.27" }
embed_anything = { version = "0.7.1", default-features = false, features = ["rustls-tls"] }
encoding_rs = "0.8.35"
eventsource-stream = "0.2.3"
fast-glob = "1.1.0"
fastrace = "0.7.19"
fastrace-reqwest = "0.3.0"
fff-search = "0.10.5"
figlet-rs = "1.0.0"
flate2 = "1.1.10"
floppy = { path = "crates/floppy", version = "0.0.1" }
futures = "0.3.34"
git2 = { version = "0.21.0", features = ["cred"] }
governor = "0.10.4"
hkdf = "0.13.0"
htmd = "0.5.5"
html-escape = "0.2.15"
http = "1.5.0"
httpmock = "0.8.3"
ignore = "0.4.33"
image = "0.25.10"
inquire = "0.9.4"
iocraft = { version = "=0.8.5" }
jsonschema = "0.52.0"
kalid = "0.1.0"
libc = "0.2.189"
linkify = "0.11.0"
lipsum = "0.9.1"
log = "0.4.34"
logforth = { version = "0.30.1", features = [
  "append-async",
  "append-fastrace",
  "append-file",
  "diagnostic-fastrace",
  "filter-rustlog",
  "layout-text",
  "starter-log",
] }
macro_rules_attribute = "0.2.3"
memchr = "2.8.3"
memorable-ids = "0.1.1"
mermaid-text = "0.57.0"
mexprp = { version = "0.3.1", default-features = false }
minijinja = "2.24.0"
parking_lot = "0.12.5"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd"] }
qrcode = "0.14.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.1.4", features = [
  "auth",
  "client",
  "transport-child-process",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
rendown = { path = "crates/rendown", version = "0.0.1" }
rustc-hash = { version = "2.1.3", features = ["std"] }
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde-jsonlines = "0.7.0"
sha2 = "0.11.0"
shell-use = { version = "0.0.1-beta.6" }
similar = { version = "3.2.0", features = ["inline", "unicode"] }
smol = "2.0.2"
smol-macros = "0.1.1"
supports-color = "3.0.2"
yaml_serde = "0.10.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
syntect = { version = "5.3.0", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "plist-load",
  "regex-fancy",
] }
tar = "0.4.46"
tempfile = "3.27.0"
textwrap = "0.16.2"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
toml = "1.1.4"
toon-format = { version = "0.5.0", default-features = false }
turso = { version = "=0.8.0-pre.7", default-features = false, features = ["fts", "mimalloc"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
urlencoding = "2.1.3"
walkdir = "2.5.0"
webpki-roots = "1.0.9"
zstd = "0.13.3"

[profile.release]
opt-level = 1
lto = false
codegen-units = 128
panic = "abort"
strip = "debuginfo"
debug = false

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.dev]
incremental = true
debug = "line-tables-only"

[patch.crates-io]
# Bracketed multiline paste (`TerminalEvent::Paste`) — not in iocraft 0.8.5 on crates.io.
iocraft = { path = "vendor/iocraft" }
