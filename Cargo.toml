[workspace]
resolver = "2"
members = ["crates/coding-agent", "crates/elph-agent", "crates/elph-ai", "crates/floppy", "crates/rendown"]
exclude = [
  "crates/control-plane",
  "crates/elph-cron",
  "crates/elph-sandbox",
  "crates/elph-swarm",
  "crates/ext-hello",
  "vendor/iocraft",
]

[workspace.package]
homepage = "https://elph.space"
repository = "https://github.com/riipandi/elph"
rust-version = "1.97"
edition = "2024"

[workspace.lints.rust]
linker_messages = "allow"

[workspace.dependencies]
aes-gcm = "0.11.0"
agent-client-protocol = "2.0.0"
anstyle = "1.0.14"
anstyle-syntect = "1.0.5"
anyhow = "1.0.104"
aws-config = "1.10.1"
aws-sdk-bedrockruntime = "1.139.0"
aws-smithy-runtime-api = "1.14.0"
aws-smithy-types = "1.6.1"
ast-grep-core = "0.45.0"
ast-grep-language = { version = "0.45.0", default-features = false, features = [
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-c-sharp",
  "tree-sitter-elixir",
  "tree-sitter-go",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
] }
astral-tl = "0.7.11"
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
backon = "1.6.0"
base64 = "0.23.1"
bytes = "1.12.1"
chord_macro = "0.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive", "usage"] }
clap_complete = "4.6.9"
clipboard-rs = "0.3.5"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
elph-agent = { path = "crates/elph-agent", version = "0.0.28" }
encoding_rs = "0.8.35"
elph-ai = { path = "crates/elph-ai", version = "0.0.28" }
elph-tui = { path = "crates/elph-tui", version = "0.0.27" }
embed_anything = { version = "0.7.1", default-features = false, features = ["rustls-tls"] }
eventsource-stream = "0.2.3"
failsafe = "1.3.0"
fast-glob = "1.1.0"
fastrace = "0.7.19"
fastrace-reqwest = "0.3.0"
fff-search = "0.10.3"
figlet-rs = "1.0.0"
floppy = { path = "crates/floppy", version = "0.0.1" }
futures = "0.3.33"
futures-util = "0.3.33"
git2 = { version = "0.21.0", features = ["cred"] }
governor = "0.10.4"
html-escape = "0.2.15"
http = "1.5.0"
httpmock = "0.8.3"
htmd = "0.5.5"
ignore = "0.4.33"
image = "0.25.10"
inquire = "0.9.4"
iocraft = "0.8.4"
jsonschema = "0.49.7"
kalid = "0.1.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
libc = "0.2.189"
linkify = "0.11.0"
lipsum = "0.9.1"
log = "0.4.33"
logforth = { version = "0.30.1", features = [
  "append-async",
  "append-fastrace",
  "append-file",
  "diagnostic-fastrace",
  "filter-rustlog",
  "layout-json",
  "layout-text",
  "starter-log",
] }
macro_rules_attribute = "0.2.0"
memchr = "2.8.3"
mermaid-text = "0.57.0"
memorable-ids = "0.1.1"
mexprp = { version = "0.3.1", default-features = false }
minijinja = "2.23.0"
parking_lot = "0.12.5"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd"] }
qrcode = "0.14.1"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde_urlencoded = "0.7.1"
rmcp = { version = "3.1.0", features = [
  "auth",
  "client",
  "transport-child-process",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
rustc-hash = { version = "2.1.3", features = ["std"] }
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde-jsonlines = "0.7.0"
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
rendown = { path = "crates/rendown", version = "0.0.1" }
shell-use = { version = "0.0.1-beta.6" }
smol = "2.0.2"
smol-macros = "0.1.1"
yaml_serde = "0.10.4"
sha2 = "0.11.0"
similar = { version = "3.1.2", features = ["inline", "unicode"] }
supports-color = "3.0.2"
syntect = { version = "5.3.0", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "plist-load",
  "regex-fancy",
] }
tempfile = "3.27.0"
textwrap = "0.16.2"
thiserror = "2.0.20"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "std", "local-offset"] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
toml = "1.1.4"
toon-format = { version = "0.5.0", default-features = false }
turso = { version = "0.8.0-pre.4", default-features = false, features = ["fts"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
urlencoding = "2.1.3"
walkdir = "2.5.0"
wasmtime = { version = "47.0.3", default-features = false, features = ["component-model", "async", "cranelift", "std"] }
webpki-roots = "1.0.9"
zstd = "0.13.3"

[profile.release]
opt-level = 1
lto = false
codegen-units = 128
panic = "abort"
strip = "symbols"
debug = false

[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
incremental = true
debug = "line-tables-only"

[patch.crates-io]
# Bracketed multiline paste (`TerminalEvent::Paste`) — not in iocraft 0.8.4 on crates.io.
iocraft = { path = "vendor/iocraft" }
