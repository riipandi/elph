# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: setup-rust
description: Prepare Rust toolchain, caches, and CI tools

inputs:
  sharedKey:
    description: Cache key prefix (e.g. ci-ubuntu-24.04). Ignored when cacheBackend is namespace.
    required: false
    default: ci
  cacheBackend:
    description: rust-cache (GitHub Actions cache) or namespace (Cache Volume). sccache always uses Cloudflare R2 when SCCACHE_BUCKET is set.
    required: false
    default: rust-cache
  installNextest:
    description: Install cargo-nextest for running tests
    required: false
    default: "true"
  installCross:
    description: Install cross and rustup targets for release builds
    required: false
    default: "false"
  installSccache:
    description: Install sccache (needed when cacheBackend is namespace)
    required: false
    default: "false"
  crossPlatform:
    description: Limit rustup targets to a release platform (linux, macos, windows)
    required: false
    default: ""
  saveCache:
    description: "Whether to save the cargo cache (default: true). Ignored for namespace."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.97.0
        components: clippy, rustfmt

    - name: Install tools
      if: inputs.installNextest == 'true' || inputs.installCross == 'true' || inputs.installSccache == 'true' || inputs.cacheBackend == 'namespace' || runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        export BINSTALL_DISABLE_TELEMETRY=true
        if ! command -v cargo-binstall >/dev/null 2>&1; then
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        fi
        if [ "${{ inputs.installNextest }}" = "true" ] && ! command -v cargo-nextest >/dev/null 2>&1; then
          cargo binstall --locked -y cargo-nextest
        fi
        if [ "${{ inputs.installSccache }}" = "true" ] || [ "${{ inputs.cacheBackend }}" = "namespace" ]; then
          if ! command -v sccache >/dev/null 2>&1; then
            cargo binstall --locked -y sccache
          fi
        fi
        # .cargo/config.toml uses clang --ld-path=wild for x86_64-unknown-linux-gnu
        if [ "$(uname -s)" = "Linux" ] && [ "$(uname -m)" = "x86_64" ]; then
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends clang
          fi
          if ! command -v wild >/dev/null 2>&1; then
            cargo binstall --locked -y wild-linker
          fi
        fi
        if [ "${{ inputs.installCross }}" = "true" ]; then
          if ! command -v cross >/dev/null 2>&1; then
            cargo binstall --locked -y cross
          fi
          platform="${{ inputs.crossPlatform }}"
          if [ -n "$platform" ]; then
            ./scripts/cross-targets.sh "$platform"
          else
            ./scripts/cross-targets.sh
          fi | while read -r target; do
            rustup target add "$target" 2>/dev/null || true
          done
        fi

    - name: Cache Cargo
      if: inputs.cacheBackend == 'rust-cache'
      uses: swatinem/rust-cache@v2.9.1
      with:
        cache-on-failure: true
        shared-key: ${{ inputs.sharedKey }}
        cache-bin: false
        save-if: ${{ inputs.saveCache }}

    - name: Cache Cargo (volume)
      if: inputs.cacheBackend == 'namespace'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: rust

    - name: Configure sccache
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_TERM_COLOR=always"
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_DIRECT=true"
          echo "SCCACHE_MAXSIZE=20G"
          echo "SCCACHE_S3_USE_SSL=true"
        } >> "$GITHUB_ENV"
        if [ -n "${SCCACHE_BUCKET:-}" ]; then
          echo "SCCACHE_REGION=${SCCACHE_REGION:-auto}" >> "$GITHUB_ENV"
        else
          echo "SCCACHE_BUCKET is unset; sccache will run without a remote cache" >&2
        fi
