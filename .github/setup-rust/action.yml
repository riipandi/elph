# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: setup-rust
description: Prepare Rust toolchain, caches, and CI tools

inputs:
  sharedKey:
    description: Cache key prefix (e.g. ci-ubuntu-24.04). Ignored when cacheBackend is namespace.
    required: false
    default: ci
  cacheBackend:
    description: rust-cache (GitHub Actions cache) or namespace (Cache Volume + Namespace sccache).
    required: false
    default: rust-cache
  installNextest:
    description: Install cargo-nextest for running tests
    required: false
    default: "true"
  installSccache:
    description: Install sccache (needed when cacheBackend is namespace)
    required: false
    default: "false"
  saveCache:
    description: "Whether to save the cargo cache (default: true). Ignored for namespace."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.97.0
        components: clippy, rustfmt

    - name: Install zig linker (Linux musl builds)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if command -v zig >/dev/null 2>&1; then
          echo "zig already installed at $(which zig)"
          exit 0
        fi
        # Zig bundles musl libc internally — no rustup musl target or distro package needed.
        # Download from ziglang.org CDN (GitHub releases no longer host these).
        ZIG_VER="0.15.2"
        case "$(uname -m)" in
          x86_64) ZIG_FILE="zig-x86_64-linux-${ZIG_VER}.tar.xz" ;;
          aarch64) ZIG_FILE="zig-aarch64-linux-${ZIG_VER}.tar.xz" ;;
        esac
        mkdir -p /opt/zig
        curl -L --proto '=https' --tlsv1.2 -sSf \
          "https://ziglang.org/download/${ZIG_VER}/${ZIG_FILE}" \
          -o /tmp/zig.tar.xz
        tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
        echo "/opt/zig" >> "$GITHUB_PATH"
        echo "zig ${ZIG_VER} installed at /opt/zig"

    - name: Install tools
      if: inputs.installNextest == 'true' || inputs.installSccache == 'true' || inputs.cacheBackend == 'namespace' || runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        export BINSTALL_DISABLE_TELEMETRY=true
        if ! command -v cargo-binstall >/dev/null 2>&1; then
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        fi
        if [ "${{ inputs.installNextest }}" = "true" ] && ! command -v cargo-nextest >/dev/null 2>&1; then
          cargo binstall --locked -y cargo-nextest
        fi
        if [ "${{ inputs.installSccache }}" = "true" ] || [ "${{ inputs.cacheBackend }}" = "namespace" ]; then
          if ! command -v sccache >/dev/null 2>&1; then
            cargo binstall --locked -y sccache
          fi
        fi
        # .cargo/config.toml uses clang --ld-path=wild for glibc Linux targets.
        if [ "$(uname -s)" = "Linux" ]; then
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends clang
          fi
          if ! command -v wild >/dev/null 2>&1; then
            cargo binstall --locked -y wild-linker
          fi
        fi

    - name: Cache Cargo
      if: inputs.cacheBackend == 'rust-cache'
      uses: swatinem/rust-cache@v2.9.1
      with:
        cache-on-failure: true
        shared-key: ${{ inputs.sharedKey }}
        cache-bin: false
        save-if: ${{ inputs.saveCache }}

    - name: Cache Cargo (volume)
      if: inputs.cacheBackend == 'namespace'
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: rust

    - name: Configure sccache
      if: inputs.cacheBackend == 'namespace'
      shell: bash
      run: |
        set -euo pipefail
        nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_TERM_COLOR=always"
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_DIRECT=true"
          echo "SCCACHE_MAXSIZE=50GB"
        } >> "$GITHUB_ENV"
