name: Feature request
description: Propose a change in Elph
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Be concrete. If this is a **pi** gap, say so — we implement on Elph, not as a TypeScript copy.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - TUI
        - Other
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Request
      description: Problem today, and what Elph should do instead.
    validations:
      required: true
