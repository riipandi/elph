name: Bug report
description: Something in Elph does not work
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security reports go to [advisories](https://github.com/riipandi/elph/security/advisories/new), not here. Do not paste API keys.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - TUI
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Repro
      description: Steps or a `make test` case.
      placeholder: |
        1. `elph` (or `elph-debug`) in a git repo
        2. …
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Version / OS
      description: "`elph --version` (or tag/SHA) and OS/arch. For TUI, add the terminal."
      placeholder: elph 0.0.26 · macOS 15 arm64 · Ghostty
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Snippet from `{logs_dir}/elph.jsonl` or `crash.log-*`. Redact secrets.
      render: text
