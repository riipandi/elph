# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  workflow_call:
    inputs:
      app:
        description: Application to test (elph)
        required: false
        type: string
        default: elph
      sharedKeyPrefix:
        description: Cache key prefix
        required: false
        type: string
        default: ci
      mode:
        description: full = fmt+check+lint+test+debug build; check = fmt+check+lint
        required: false
        type: string
        default: full
  push:
    branches: [main]
    paths:
      - "crates/coding-agent/**"
      - "crates/elph-agent/**"
      - "crates/elph-ai/**"
      - "crates/elph-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/**"
  pull_request:
    paths:
      - "crates/coding-agent/**"
      - "crates/elph-agent/**"
      - "crates/elph-ai/**"
      - "crates/elph-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Windows GitHub-hosted compiles (wasmtime) often exceed the gap between main
  # pushes. Cancelling those runs also drops rust-cache, so the next job starts cold.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  BINSTALL_DISABLE_TELEMETRY: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: namespace-profile-linux-base-amd64
            cacheBackend: namespace
          - name: macos
            runner: namespace-profile-macos-base-arm64
            cacheBackend: namespace
          - name: windows
            runner: windows-latest
            cacheBackend: rust-cache
            timeoutMinutes: 90
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes || 45 }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: ${{ inputs.sharedKeyPrefix || 'ci' }}-${{ inputs.app || 'elph' }}-${{ matrix.name }}
          cacheBackend: ${{ matrix.cacheBackend }}
          saveCache: ${{ github.ref == 'refs/heads/main' || matrix.name == 'windows' }}

      - name: Check format
        shell: bash
        run: cargo fmt --all --check

      - name: Check compile
        shell: bash
        run: make check

      - name: Lint
        shell: bash
        run: make lint

      - name: Lint (elph-agent full features)
        if: matrix.name != 'windows' && (inputs.app || 'elph') == 'elph'
        shell: bash
        run: make lint -- -p elph-agent --features full

      - name: Test
        if: (inputs.mode || 'full') == 'full'
        shell: bash
        run: make test

      - name: Test (elph-agent full features)
        if: matrix.name != 'windows' && (inputs.mode || 'full') == 'full' && (inputs.app || 'elph') == 'elph'
        shell: bash
        run: make test -- -p elph-agent --features full

      - name: Build debug
        if: matrix.name != 'windows' && (inputs.mode || 'full') == 'full'
        shell: bash
        run: make build
        env:
          RUSTC_WRAPPER: ${{ matrix.name != 'windows' && 'sccache' || '' }}

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats
