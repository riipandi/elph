# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  workflow_call:
    inputs:
      app:
        description: Application to test (elph)
        required: false
        type: string
        default: elph
      sharedKeyPrefix:
        description: Cache key prefix
        required: false
        type: string
        default: ci
      mode:
        description: full = fmt+check+lint+test+debug build; check = fmt+check+lint
        required: false
        type: string
        default: full
      os:
        description: Restrict the matrix to a single platform (linux/macos/windows). Empty runs all.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      os:
        description: Platform to test
        required: false
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
  # push:
  #   branches: [main]
  #   paths:
  #     - "crates/coding-agent/**"
  #     - "crates/elph-agent/**"
  #     - "crates/elph-ai/**"
  #     - "crates/elph-tui/**"
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - "rust-toolchain.toml"
  #     - "Makefile"
  #     - ".github/**"
  pull_request:
    paths:
      - "crates/coding-agent/**"
      - "crates/elph-agent/**"
      - "crates/elph-ai/**"
      - "crates/elph-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/**"

permissions:
  contents: read

concurrency:
  # Include inputs.os so the release pipeline's per-OS check jobs
  # (linux/macos/windows, invoked via workflow_call) each get a distinct group
  # and run in parallel. For pull_request runs os is empty, so all matrix legs
  # share the group and cancel-in-progress still applies per PR.
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.os || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  BINSTALL_DISABLE_TELEMETRY: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ ((inputs.os || 'all') == 'all') && fromJson('[{"name":"linux","runner":"namespace-profile-linux-base-amd64","cacheBackend":"namespace"},{"name":"macos","runner":"namespace-profile-macos-base-arm64","cacheBackend":"namespace"},{"name":"windows","runner":"avrea-windows-2025-4-vcpu","cacheBackend":"avrea","timeoutMinutes":90}]') || fromJson(format('[{{"name":"{0}","runner":"{1}","cacheBackend":"{2}"}}]', inputs.os || 'all', fromJson('{"linux":"namespace-profile-linux-base-amd64","macos":"namespace-profile-macos-base-arm64","windows":"avrea-windows-2025-4-vcpu"}')[inputs.os || 'all'], fromJson('{"linux":"namespace","macos":"namespace","windows":"avrea"}')[inputs.os || 'all'])) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes || 45 }}
    env:
      # sccache via the Avrea WebDAV endpoint (no R2/S3) — Windows only.
      CARGO_INCREMENTAL: ${{ matrix.name == 'windows' && '0' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: ${{ inputs.sharedKeyPrefix || 'ci' }}-${{ inputs.app || 'elph' }}-${{ matrix.name }}
          cacheBackend: ${{ matrix.cacheBackend }}
          saveCache: ${{ github.ref == 'refs/heads/main' || matrix.name == 'windows' }}

      - name: Check format
        shell: bash
        run: cargo fmt --all --check

      - name: Check compile
        shell: bash
        run: make check

      - name: Lint
        shell: bash
        run: make lint

      - name: Test
        if: (inputs.mode || 'full') == 'full'
        shell: bash
        run: make test

      - name: Build debug
        if: (inputs.mode || 'full') == 'full'
        shell: bash
        run: make build

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats
