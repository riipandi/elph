# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  workflow_call:
    inputs:
      app:
        description: Application to test (elph)
        required: false
        type: string
        default: elph
      sharedKeyPrefix:
        description: Cache key prefix
        required: false
        type: string
        default: ci
      mode:
        description: full = fmt+check+lint+test+debug build; check = fmt+check+lint
        required: false
        type: string
        default: full
      os:
        description: Restrict the matrix to a single platform (linux/macos/windows). Empty runs all.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      os:
        description: Platform to test (all runs linux, macos, and windows)
        required: false
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
  # push:
  #   branches: [main]
  #   paths:
  #     - "crates/coding-agent/**"
  #     - "crates/elph-agent/**"
  #     - "crates/elph-ai/**"
  #     - "crates/elph-tui/**"
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - "rust-toolchain.toml"
  #     - "Makefile"
  #     - ".github/**"
  pull_request:
    paths:
      - "crates/coding-agent/**"
      - "crates/elph-agent/**"
      - "crates/elph-ai/**"
      - "crates/elph-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  BINSTALL_DISABLE_TELEMETRY: true

jobs:
  test:
    name: ${{ matrix.name }}
    if: >-
      inputs.os == '' || inputs.os == 'all' || inputs.os == matrix.name
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: namespace-profile-linux-base-amd64
            cacheBackend: namespace
          - name: macos
            runner: namespace-profile-macos-base-arm64
            cacheBackend: namespace
          # Windows runs on Avrea (4 vCPU / 16 GB, vs 4 vCPU / 16 GB GitHub-hosted).
          # No sharding: Avrea colocated caching keeps a single runner fast enough,
          # and sharded runs duplicate compile work across jobs.
          - name: windows
            runner: avrea-windows-2025-4-vcpu
            cacheBackend: avrea
            timeoutMinutes: 90
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes || 45 }}
    env:
      # sccache via the Avrea WebDAV endpoint (no R2/S3) — Windows only.
      CARGO_INCREMENTAL: ${{ matrix.name == 'windows' && '0' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: ${{ inputs.sharedKeyPrefix || 'ci' }}-${{ inputs.app || 'elph' }}-${{ matrix.name }}
          cacheBackend: ${{ matrix.cacheBackend }}
          saveCache: ${{ github.ref == 'refs/heads/main' || matrix.name == 'windows' }}

      - name: Check format
        shell: bash
        run: cargo fmt --all --check

      - name: Check compile
        shell: bash
        run: make check

      - name: Lint
        shell: bash
        run: make lint

      - name: Test
        if: (inputs.mode || 'full') == 'full'
        shell: bash
        run: make test

      - name: Build debug
        if: (inputs.mode || 'full') == 'full'
        shell: bash
        run: make build

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats
