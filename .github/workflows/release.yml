# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# git tag -d v0.0.1-canary
# git push origin --delete v0.0.1-canary
#
# git tag v0.0.1-canary -m "canary build"
# git push origin v0.0.1-canary

name: Release

on:
  workflow_call:
    inputs:
      app:
        description: Application to release (elph)
        required: false
        type: string
        default: elph
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-canary"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
  queue: single

permissions:
  contents: write

env:
  CI: true
  BINSTALL_DISABLE_TELEMETRY: true
  RELEASE_ALLOWED_ACTORS: ${{ vars.RELEASE_ALLOWED_ACTORS }}
  # Channel + build profile are derived from the pushed tag:
  #   v*.*.*        -> release channel, `dist` profile
  #   v*.*.*-canary -> canary channel,  `release` profile
  RELEASE_CHANNEL: ${{ endsWith(github.ref_name, '-canary') && 'canary' || 'release' }}
  BUILD_PROFILE: ${{ endsWith(github.ref_name, '-canary') && 'release' || 'dist' }}

jobs:
  auth:
    name: auth
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check actor
        run: ./scripts/ci-check-release-actor.sh

  version-gate:
    name: version
    needs: auth
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      should_continue: ${{ steps.gate.outputs.should_continue }}
      release_version: ${{ steps.gate.outputs.release_version }}
      cargo_version: ${{ steps.gate.outputs.cargo_version }}
      latest_release: ${{ steps.gate.outputs.latest_release }}
      release_channel: ${{ steps.gate.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./.github/version-gate
        with:
          app: ${{ inputs.app || 'elph' }}

  check-linux:
    name: check (linux)
    needs: version-gate
    if: needs.version-gate.outputs.should_continue == 'true'
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      app: ${{ inputs.app || 'elph' }}
      sharedKeyPrefix: release
      mode: check
      os: linux

  check-macos:
    name: check (macos)
    needs: version-gate
    if: needs.version-gate.outputs.should_continue == 'true'
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      app: ${{ inputs.app || 'elph' }}
      sharedKeyPrefix: release
      mode: check
      os: macos

  check-windows:
    name: check (windows)
    needs: version-gate
    if: needs.version-gate.outputs.should_continue == 'true'
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      app: ${{ inputs.app || 'elph' }}
      sharedKeyPrefix: release
      mode: check
      os: windows

  build-linux:
    name: linux (${{ matrix.arch }})
    needs: [version-gate, check-linux]
    if: needs.version-gate.outputs.should_continue == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: namespace-profile-linux-base-amd64
            rust_arch: x86_64
          - arch: arm64
            runner: namespace-profile-linux-base-arm64
            rust_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-linux-${{ matrix.arch }}
          cacheBackend: namespace
          installNextest: "false"

      - name: Install gnu targets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_TRIPLE="${{ matrix.rust_arch }}-unknown-linux-gnu"
          rustup target add "$TARGET_TRIPLE"

      - name: Build release
        run: |
          cargo build --profile ${{ env.BUILD_PROFILE }} --bin ${{ inputs.app || 'elph' }} \
            --target ${{ matrix.rust_arch }}-unknown-linux-gnu
        env:
          APP: ${{ inputs.app || 'elph' }}
          RUSTC_WRAPPER: sccache

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          triple="${{ matrix.rust_arch }}-unknown-linux-gnu"
          label="${app}-linux-${{ matrix.arch }}"
          mkdir -p release/archives release/binaries
          cp "target/${triple}/${{ env.BUILD_PROFILE }}/${app}" "release/binaries/${label}"
          tar -C "target/${triple}/${{ env.BUILD_PROFILE }}" -czf "release/archives/${label}.tar.gz" "${app}"

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-linux-${{ matrix.arch }}
          path: |
            release/archives/${{ inputs.app || 'elph' }}-linux-${{ matrix.arch }}.tar.gz
            release/binaries/${{ inputs.app || 'elph' }}-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-macos:
    name: macos (${{ matrix.arch }})
    needs: [version-gate, check-macos]
    if: needs.version-gate.outputs.should_continue == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: namespace-profile-macos-base-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-macos-${{ matrix.arch }}
          cacheBackend: namespace
          installNextest: "false"

      - name: Install ${{ matrix.target }} target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --profile ${{ env.BUILD_PROFILE }} --bin ${{ inputs.app || 'elph' }} --target ${{ matrix.target }}
        env:
          APP: ${{ inputs.app || 'elph' }}
          RUSTC_WRAPPER: sccache

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          label="${app}-macos-${{ matrix.arch }}"
          mkdir -p release/archives release/binaries
          cp "target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/${app}" "release/binaries/${label}"
          tar -C "target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}" -czf "release/archives/${label}.tar.gz" "${app}"

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-macos-${{ matrix.arch }}
          path: |
            release/archives/${{ inputs.app || 'elph' }}-macos-${{ matrix.arch }}.tar.gz
            release/binaries/${{ inputs.app || 'elph' }}-macos-${{ matrix.arch }}
          if-no-files-found: error

  build-windows:
    name: windows
    needs: [version-gate, check-windows]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: avrea-windows-2025-16-vcpu
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        shell: bash
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-windows
          cacheBackend: avrea
          installNextest: "false"

      - name: Build release
        shell: bash
        run: cargo build --profile ${{ env.BUILD_PROFILE }} --bin ${{ inputs.app || 'elph' }}
        env:
          APP: ${{ inputs.app || 'elph' }}

      - name: Package
        shell: pwsh
        run: |
          $app = "${{ inputs.app || 'elph' }}"
          $label = "$app-windows-x86_64"
          New-Item -ItemType Directory -Force -Path release/archives, release/binaries | Out-Null
          Copy-Item "target/${{ env.BUILD_PROFILE }}/$app.exe" "release/binaries/$label.exe"
          Compress-Archive -Force -Path "target/${{ env.BUILD_PROFILE }}/$app.exe" -DestinationPath "release/archives/$label.zip"

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-windows
          path: |
            release/archives/${{ inputs.app || 'elph' }}-windows-*.zip
            release/binaries/${{ inputs.app || 'elph' }}-windows-*
          if-no-files-found: error

  publish:
    name: publish
    needs: [version-gate, build-linux, build-macos, build-windows]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Fetch linux (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-linux-x86_64
          path: .

      - name: Fetch linux (arm64)
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-linux-arm64
          path: .

      - name: Fetch macos (aarch64)
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-macos-aarch64
          path: .

      - name: Fetch macos (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-macos-x86_64
          path: .

      - name: Fetch windows
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-windows
          path: .

      - name: Log version
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing ${{ inputs.app || 'elph' }} v${{ needs.version-gate.outputs.release_version }} (${{ needs.version-gate.outputs.release_channel }} channel, ${GITHUB_REF_NAME})"

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          mkdir -p "release/archives"
          # download-artifact may extract archives flat into release/archives or
          # nest them under the artifact name; gather every elph-*.tar.gz / elph-*.zip
          # regardless of where it lands.
          shopt -s nullglob
          readarray -t archives < <(find . -path ./target -prune -o -path ./.git -prune -o -type f \( -name "${app}-*.tar.gz" -o -name "${app}-*.zip" \) -print)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No ${app}-*.tar.gz / ${app}-*.zip artifacts found after download" >&2
            exit 1
          fi
          for f in "${archives[@]}"; do
            cp -f "$f" "release/archives/"
          done
          echo "Staged archives:"
          ls -la release/archives

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          shopt -s nullglob
          cd release/archives
          files=( "${app}"-*.tar.gz "${app}"-*.zip )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No ${app}-*.tar.gz / ${app}-*.zip found in release/archives" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- "${files[@]}" > SHA256SUMS
          else
            shasum -a 256 -- "${files[@]}" > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: false
          prerelease: true
          generate_release_notes: true
          files: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/archives/SHA256SUMS

  sync-version:
    name: sync
    needs: [version-gate, publish]
    if: >-
      needs.version-gate.outputs.should_continue == 'true' &&
      needs.version-gate.outputs.release_channel == 'release'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    concurrency:
      group: sync-main-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync version
        env:
          APP: ${{ inputs.app || 'elph' }}
          RELEASED_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-sync-app-version-on-main.sh

      - name: Push main
        env:
          APP: ${{ inputs.app || 'elph' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/coding-agent/Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore(${APP}): sync version to ${GITHUB_REF_NAME} on main"
          git pull --rebase origin main
          git push origin main
