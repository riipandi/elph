# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# git tag --delete v0.0.1
# git push origin --delete tag v0.0.1
#
# git tag v0.0.1 -m "version bump"
# git push origin v0.0.1
#
# git tag v0.0.1-canary -m "canary build"
# git push origin v0.0.1-canary

name: Release

on:
  workflow_call:
    inputs:
      app:
        description: Application to release (elph)
        required: false
        type: string
        default: elph
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-canary"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
  queue: single

permissions:
  contents: write

env:
  CI: true
  BINSTALL_DISABLE_TELEMETRY: true
  RELEASE_ALLOWED_ACTORS: ${{ vars.RELEASE_ALLOWED_ACTORS }}
  # Channel + build profile are derived from the pushed tag:
  #   v*.*.*        -> release channel, `dist` profile
  #   v*.*.*-canary -> canary channel,  `release` profile
  RELEASE_CHANNEL: ${{ endsWith(github.ref_name, '-canary') && 'canary' || 'release' }}
  BUILD_PROFILE: ${{ endsWith(github.ref_name, '-canary') && 'release' || 'dist' }}

jobs:
  auth:
    name: auth
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check actor
        run: ./scripts/ci-check-release-actor.sh

  version-gate:
    name: version
    needs: auth
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      should_continue: ${{ steps.gate.outputs.should_continue }}
      release_version: ${{ steps.gate.outputs.release_version }}
      cargo_version: ${{ steps.gate.outputs.cargo_version }}
      latest_release: ${{ steps.gate.outputs.latest_release }}
      release_channel: ${{ steps.gate.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./.github/version-gate
        with:
          app: ${{ inputs.app || 'elph' }}

  quality-gate:
    name: check
    needs: version-gate
    if: needs.version-gate.outputs.should_continue == 'true'
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      app: ${{ inputs.app || 'elph' }}
      sharedKeyPrefix: release
      mode: check

  build-linux:
    name: linux (${{ matrix.arch }})
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.should_continue == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-linux-base-amd64
            label: x86_64
          - arch: arm64
            runner: namespace-profile-linux-base-arm64
            label: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-linux-${{ matrix.arch }}
          cacheBackend: namespace
          installNextest: "false"

      - name: Install musl targets & zig linker for cross-build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_TRIPLE="${{ matrix.label }}-unknown-linux-musl"
          rustup target add "$TARGET_TRIPLE"
          # Zig bundles musl libc — no apt package needed.
          if ! command -v zig >/dev/null 2>&1; then
            ZIG_VER="0.15.2"
            case "$(uname -m)" in
              x86_64) ZIG_FILE="zig-x86_64-linux-${ZIG_VER}.tar.xz" ;;
              aarch64) ZIG_FILE="zig-aarch64-linux-${ZIG_VER}.tar.xz" ;;
            esac
            mkdir -p /opt/zig
            curl -L --proto '=https' --tlsv1.2 -sSf \
              "https://ziglang.org/download/${ZIG_VER}/${ZIG_FILE}" \
              -o /tmp/zig.tar.xz
            tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            echo "/opt/zig" >> "$GITHUB_PATH"
          fi
          # Provide a C/C++ compiler for the musl target. ring's build script
          # (cc-rs) looks for `<triple>-gcc`, which no longer exists since we
          # dropped musl-tools. Point it at zig cc via a wrapper so the same zig
          # toolchain compiles the C sources for the musl target.
          CC_WRAPPER="/usr/local/bin/${TARGET_TRIPLE}-gcc"
          CXX_WRAPPER="/usr/local/bin/${TARGET_TRIPLE}-g++"
          # Zig uses its own triple format without the `unknown` vendor
          # (x86_64-linux-musl); it rejects the Rust triple's
          # x86_64-unknown-linux-musl ("UnknownOperatingSystem").
          ZIG_TRIPLE=$(printf '%s' "$TARGET_TRIPLE" | sed 's/-unknown-/-/')
          cat > "$CC_WRAPPER" <<EOF
          #!/bin/sh
          # cc-rs appends --target=<rust-triple> for clang-family compilers;
          # zig cannot parse that triple, so drop it here and pass the
          # zig-native target explicitly.
          new=""
          for a in "\$@"; do
            case "\$a" in
              --target=*) continue ;;
            esac
            new="\$new \$a"
          done
          exec zig cc -target ${ZIG_TRIPLE} \$new
          EOF
          cat > "$CXX_WRAPPER" <<EOF
          #!/bin/sh
          # Same as the C wrapper: drop --target=<rust-triple>, pass zig triple.
          new=""
          for a in "\$@"; do
            case "\$a" in
              --target=*) continue ;;
            esac
            new="\$new \$a"
          done
          exec zig c++ -target ${ZIG_TRIPLE} \$new
          EOF
          chmod +x "$CC_WRAPPER" "$CXX_WRAPPER"
          # cc-rs reads CC_<target> in lowercase, checking both the dash form
          # (exact triple) and the underscore form. Export both to be safe
          # across cc crate versions.
          ENV_KEY_UNDER=$(echo "$TARGET_TRIPLE" | tr '-' '_')
          echo "CC_${TARGET_TRIPLE}=${CC_WRAPPER}" >> "$GITHUB_ENV"
          echo "CC_${ENV_KEY_UNDER}=${CC_WRAPPER}" >> "$GITHUB_ENV"
          echo "CXX_${TARGET_TRIPLE}=${CXX_WRAPPER}" >> "$GITHUB_ENV"
          echo "CXX_${ENV_KEY_UNDER}=${CXX_WRAPPER}" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          cargo build --profile ${{ env.BUILD_PROFILE }} --bin ${{ inputs.app || 'elph' }} \
            --target ${{ matrix.label }}-unknown-linux-musl
        env:
          APP: ${{ inputs.app || 'elph' }}
          # sccache does not support zig as a compiler family, so it cannot wrap
          # the zig cc C compiler above. Disable the wrapper for this cross-build;
          # target/ is still cached on the Namespace cache volume.
          RUSTC_WRAPPER: ""

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          triple="${{ matrix.label }}-unknown-linux-musl"
          label="${app}-linux-${{ matrix.label }}"
          mkdir -p release/archives release/binaries
          cp "target/${triple}/${{ env.BUILD_PROFILE }}/${app}" "release/binaries/${label}"
          tar -C "target/${triple}/${{ env.BUILD_PROFILE }}" -czf "release/archives/${label}.tar.gz" "${app}"

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-linux-${{ matrix.arch }}
          path: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/binaries/${{ inputs.app || 'elph' }}-*
          if-no-files-found: error

  build-macos:
    name: macos
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: namespace-profile-macos-base-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-macos
          cacheBackend: namespace
          installNextest: "false"

      - name: Install x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin

      - name: Build release
        run: |
          cargo build --profile ${{ env.BUILD_PROFILE }} --bin ${{ inputs.app || 'elph' }} --target aarch64-apple-darwin
          cargo build --profile ${{ env.BUILD_PROFILE }} --bin ${{ inputs.app || 'elph' }} --target x86_64-apple-darwin
        env:
          APP: ${{ inputs.app || 'elph' }}
          RUSTC_WRAPPER: sccache

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          declare -A arch_map=( [aarch64-apple-darwin]=arm64 [x86_64-apple-darwin]=x86_64 )
          mkdir -p release/archives release/binaries
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            arch="${arch_map[$target]}"
            label="${app}-macos-${arch}"
            cp "target/${target}/${{ env.BUILD_PROFILE }}/${app}" "release/binaries/${label}"
            tar -C "target/${target}/${{ env.BUILD_PROFILE }}" -czf "release/archives/${label}.tar.gz" "${app}"
          done

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-macos
          path: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/binaries/${{ inputs.app || 'elph' }}-*
          if-no-files-found: error

  build-windows:
    name: windows
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: avrea-windows-2025-4-vcpu
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        shell: bash
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-windows
          cacheBackend: avrea
          installNextest: "false"

      - name: Build release
        shell: bash
        run: cargo build --profile ${{ env.BUILD_PROFILE }} --bin ${{ inputs.app || 'elph' }}
        env:
          APP: ${{ inputs.app || 'elph' }}

      - name: Package
        shell: pwsh
        run: |
          $app = "${{ inputs.app || 'elph' }}"
          $label = "$app-windows-x86_64"
          New-Item -ItemType Directory -Force -Path release/archives, release/binaries | Out-Null
          Copy-Item "target/${{ env.BUILD_PROFILE }}/$app.exe" "release/binaries/$label.exe"
          Compress-Archive -Force -Path "target/${{ env.BUILD_PROFILE }}/$app.exe" -DestinationPath "release/archives/$label.zip"

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-windows
          path: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/binaries/${{ inputs.app || 'elph' }}-*
          if-no-files-found: error

  publish:
    name: publish
    needs: [version-gate, build-linux, build-macos, build-windows]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Fetch linux (amd64)
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-linux-amd64
          path: .

      - name: Fetch linux (arm64)
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-linux-arm64
          path: .

      - name: Fetch macos
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-macos
          path: .

      - name: Fetch windows
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-windows
          path: .

      - name: Log version
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing ${{ inputs.app || 'elph' }} v${{ needs.version-gate.outputs.release_version }} (${{ needs.version-gate.outputs.release_channel }} channel, ${GITHUB_REF_NAME})"

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          mkdir -p "release/archives"
          # download-artifact may extract archives flat into release/archives or
          # nest them under the artifact name; gather every elph-*.tar.gz / elph-*.zip
          # regardless of where it lands.
          shopt -s nullglob
          readarray -t archives < <(find . -path ./target -prune -o -path ./.git -prune -o -type f \( -name "${app}-*.tar.gz" -o -name "${app}-*.zip" \) -print)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No ${app}-*.tar.gz / ${app}-*.zip artifacts found after download" >&2
            exit 1
          fi
          for f in "${archives[@]}"; do
            cp -f "$f" "release/archives/"
          done
          echo "Staged archives:"
          ls -la release/archives

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          shopt -s nullglob
          cd release/archives
          files=( "${app}"-*.tar.gz "${app}"-*.zip )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No ${app}-*.tar.gz / ${app}-*.zip found in release/archives" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- "${files[@]}" > SHA256SUMS
          else
            shasum -a 256 -- "${files[@]}" > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: false
          prerelease: true
          generate_release_notes: true
          files: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/archives/SHA256SUMS

  sync-version:
    name: sync
    needs: [version-gate, publish]
    if: >-
      needs.version-gate.outputs.should_continue == 'true' &&
      needs.version-gate.outputs.release_channel == 'release'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    concurrency:
      group: sync-main-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync version
        env:
          APP: ${{ inputs.app || 'elph' }}
          RELEASED_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-sync-app-version-on-main.sh

      - name: Push main
        env:
          APP: ${{ inputs.app || 'elph' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/coding-agent/Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore(${APP}): sync version to ${GITHUB_REF_NAME} on main"
          git pull --rebase origin main
          git push origin main
