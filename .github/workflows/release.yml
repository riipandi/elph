# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  workflow_call:
    inputs:
      app:
        description: Application to release (elph)
        required: false
        type: string
        default: elph
    secrets:
      SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false
  push:
    tags: ["elph-v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true
  BINSTALL_DISABLE_TELEMETRY: true
  RELEASE_ALLOWED_ACTORS: ${{ vars.RELEASE_ALLOWED_ACTORS }}
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
  SCCACHE_BUCKET: ${{ vars.SCCACHE_R2_BUCKET }}
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_R2_ENDPOINT }}
  SCCACHE_REGION: ${{ vars.SCCACHE_R2_REGION || 'auto' }}

jobs:
  auth:
    name: auth
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check actor
        run: ./scripts/ci-check-release-actor.sh

  version-gate:
    name: version
    needs: auth
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      should_continue: ${{ steps.gate.outputs.should_continue }}
      release_version: ${{ steps.gate.outputs.release_version }}
      cargo_version: ${{ steps.gate.outputs.cargo_version }}
      latest_release: ${{ steps.gate.outputs.latest_release }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./.github/version-gate
        with:
          app: ${{ inputs.app || 'elph' }}

  quality-gate:
    name: check
    needs: version-gate
    if: needs.version-gate.outputs.should_continue == 'true'
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      app: ${{ inputs.app || 'elph' }}
      sharedKeyPrefix: release
      mode: check

  build-linux:
    name: linux
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: namespace-profile-linux-base-amd64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-linux
          cacheBackend: namespace
          installNextest: "false"

      - name: Build release
        run: cargo build --release --bin ${{ inputs.app || 'elph' }}
        env:
          APP: ${{ inputs.app || 'elph' }}
          RUSTC_WRAPPER: sccache

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          label="${app}-linux-x86_64"
          mkdir -p release/archives release/binaries
          cp "target/release/${app}" "release/binaries/${label}"
          tar -C target/release -czf "release/archives/${label}.tar.gz" "${app}"

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-linux
          path: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/binaries/${{ inputs.app || 'elph' }}-*
          if-no-files-found: error

  build-macos:
    name: macos
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: namespace-profile-macos-base-arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-macos
          cacheBackend: namespace
          installNextest: "false"

      - name: Build release
        run: make release-macos
        env:
          APP: ${{ inputs.app || 'elph' }}
          RUSTC_WRAPPER: sccache

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-macos
          path: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/binaries/${{ inputs.app || 'elph' }}-*
          if-no-files-found: error

  build-windows:
    name: windows
    needs: [version-gate, quality-gate]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: namespace-profile-windows-base-amd64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Pin version
        shell: bash
        env:
          APP: ${{ inputs.app || 'elph' }}
          TARGET_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-set-app-version.sh

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: release-windows
          cacheBackend: namespace
          installNextest: "false"

      - name: Build release
        shell: bash
        run: cargo build --release --bin ${{ inputs.app || 'elph' }}
        env:
          RUSTC_WRAPPER: sccache

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          label="${app}-win-x86_64"
          mkdir -p release/archives release/binaries
          cp "target/release/${app}.exe" "release/binaries/${label}.exe"
          cd target/release && zip -q -j "${{ github.workspace }}/release/archives/${label}.zip" "${app}.exe"

      - name: Show sccache stats
        if: always()
        uses: ./.github/show-sccache-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app || 'elph' }}-windows
          path: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/binaries/${{ inputs.app || 'elph' }}-*
          if-no-files-found: error

  publish:
    name: publish
    needs: [version-gate, build-linux, build-macos, build-windows]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Fetch linux
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-linux
          path: .

      - name: Fetch macos
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-macos
          path: .

      - name: Fetch windows
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app || 'elph' }}-windows
          path: .

      - name: Log version
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing ${{ inputs.app || 'elph' }} v${{ needs.version-gate.outputs.release_version }} (${GITHUB_REF_NAME})"

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app || 'elph' }}"
          mkdir -p "release/archives"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release/archives && sha256sum -- ${app}-* > SHA256SUMS)
          else
            (cd release/archives && shasum -a 256 -- ${app}-* > SHA256SUMS)
          fi
          cat "release/archives/SHA256SUMS"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          files: |
            release/archives/${{ inputs.app || 'elph' }}-*
            release/archives/SHA256SUMS

  sync-version:
    name: sync
    needs: [version-gate, publish]
    if: needs.version-gate.outputs.should_continue == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    concurrency:
      group: sync-main-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync version
        env:
          APP: ${{ inputs.app || 'elph' }}
          RELEASED_VERSION: ${{ needs.version-gate.outputs.release_version }}
        run: ./scripts/ci-sync-app-version-on-main.sh

      - name: Push main
        env:
          APP: ${{ inputs.app || 'elph' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/coding-agent/Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore(${APP}): sync version to ${GITHUB_REF_NAME} on main"
          git pull --rebase origin main
          git push origin main
