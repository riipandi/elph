# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI App

on:
  workflow_call:
    inputs:
      app:
        description: Application to test (elph)
        required: true
        type: string
      sharedKeyPrefix:
        description: Cache key prefix
        required: false
        type: string
        default: ci
      mode:
        description: Quality gate mode (full = fmt+check+lint+test+debug build; check = fmt+check+lint)
        required: false
        type: string
        default: full
    secrets:
      SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  CI: true
  BINSTALL_DISABLE_TELEMETRY: true
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
  SCCACHE_BUCKET: ${{ vars.SCCACHE_R2_BUCKET }}
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_R2_ENDPOINT }}
  SCCACHE_REGION: ${{ vars.SCCACHE_R2_REGION || 'auto' }}

jobs:
  quality:
    name: ${{ inputs.app }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - namespace-profile-linux-base-amd64
          - namespace-profile-macos-base-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/setup-rust
        with:
          sharedKey: ${{ inputs.sharedKeyPrefix }}-${{ inputs.app }}-${{ matrix.os }}
          cacheBackend: namespace
          saveCache: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check compilation
        run: make check-${{ inputs.app }}

      - name: Lint
        run: make lint-${{ inputs.app }}

      - name: Test
        if: inputs.mode == 'full'
        run: make test-${{ inputs.app }}

      - name: Build debug binary
        if: inputs.mode == 'full'
        run: make build-${{ inputs.app }}
        env:
          RUSTC_WRAPPER: sccache

      - name: Show sccache statistics
        if: always()
        uses: ./.github/show-sccache-stats
