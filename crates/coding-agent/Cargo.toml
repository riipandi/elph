[package]
name = "elph"
version = "0.1.3"
license = "Apache-2.0"
description = "Minimalist AI agent companion for coding"
keywords = ["ai", "agent", "cli", "coding", "llm"]
categories = ["command-line-utilities", "development-tools"]
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = true

[lib]
name = "elph"
path = "src/lib.rs"

[[bin]]
name = "elph"
path = "src/main.rs"

[features]
# Forward Metal GPU acceleration for local embeddings (memory) to
# floppy. Enabling this requires building on Apple Silicon macOS (the `metal`
# code path only compiles there). See `make build` which adds it automatically
# on macOS aarch64.
metal = ["floppy/metal"]

[build-dependencies]
sha2.workspace = true

[dependencies]
agent-client-protocol.workspace = true
anstyle.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
dotenvy.workspace = true
flate2.workspace = true
elph-agent = { workspace = true, features = [
  "tracing",
  "builtin-tools",
  "mcp",
  "prompt-templates",
  "extensions",
  "tools-shell-use",
  "backend-turso",
] }
elph-ai = { workspace = true, features = ["tracing", "bedrock", "oauth-callback"] }
elph-tui = { workspace = true }
floppy = { workspace = true, features = ["full"] }
git2 = { workspace = true, features = ["cred"] }
inquire.workspace = true
iocraft.workspace = true
log.workspace = true
memorable-ids.workspace = true
minijinja = { workspace = true, features = ["custom_syntax"] }
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
rendown = { workspace = true, features = ["highlight", "mermaid", "stream"] }
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "io-std",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "process",
  "signal",
] }
turso = { workspace = true, features = ["fts"] }
tokio-util = { workspace = true, features = ["compat"] }
zip.workspace = true
yaml_serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
elph-agent = { workspace = true, features = ["full"] }
elph-ai = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints.rust]
linker_messages = "allow"

[[example]]
name = "test_notifications"
path = "examples/test_notifications.rs"
