[package]
name = "elph-ai"
version = "0.0.28"
license = "MIT"
description = "Unified LLM API with provider collections, auth resolution, and streaming"
keywords = ["ai", "llm", "provider", "api", "elph"]
categories = ["api-bindings", "development-tools"]
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = true
include = ["Cargo.toml", "src/**/*", "models/**/*.json", "README.md", "CHANGELOG.md"]

[lib]
name = "elph_ai"
path = "src/lib.rs"

[features]
default = []
bedrock = [
  "dep:aws-config",
  "dep:aws-sdk-bedrockruntime",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
]
oauth-callback = ["dep:axum"]
generate-models = ["dep:clap", "dep:image"]
tracing = ["dep:fastrace", "dep:fastrace-reqwest", "fastrace/enable"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anstyle.workspace = true
anyhow.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["query"] }
backon.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true, features = ["derive", "env"] }
eventsource-stream.workspace = true
fastrace = { workspace = true, optional = true }
fastrace-reqwest = { workspace = true, optional = true }
futures.workspace = true
governor.workspace = true
http.workspace = true
image = { workspace = true, optional = true }
jsonschema.workspace = true
log.workspace = true
memchr.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-jsonlines.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
url.workspace = true
webpki-roots.workspace = true
zstd.workspace = true

[build-dependencies]
zstd.workspace = true

[[bin]]
name = "generate-models"
path = "bin/generate_models/main.rs"
required-features = ["generate-models"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[[example]]
name = "browse_models"
path = "examples/browse_models.rs"

[[example]]
name = "tool_loop"
path = "examples/tool_loop.rs"

[[example]]
name = "images"
path = "examples/images.rs"

[[example]]
name = "custom_provider"
path = "examples/custom_provider.rs"

[[example]]
name = "auth_custom"
path = "examples/auth_custom.rs"

[dev-dependencies]
axum = { workspace = true, features = ["query"] }
parking_lot.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "tracing_http"
path = "tests/tracing_http.rs"
required-features = ["tracing"]

[[test]]
name = "bedrock_convert_messages"
path = "tests/bedrock_convert_messages.rs"
required-features = ["bedrock"]

[[test]]
name = "bedrock_endpoint_resolution"
path = "tests/bedrock_endpoint_resolution.rs"
required-features = ["bedrock"]

[[test]]
name = "bedrock_thinking_payload"
path = "tests/bedrock_thinking_payload.rs"
required-features = ["bedrock"]

[[test]]
name = "bedrock_custom_headers"
path = "tests/bedrock_custom_headers.rs"
required-features = ["bedrock"]

[lints.rust]
linker_messages = "allow"
