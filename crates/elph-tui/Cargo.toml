[package]
name = "elph-tui"
version = "0.0.27"
license = "MIT"
description = "Terminal UI components for Elph agent"
keywords = ["tui", "terminal", "prompt", "iocraft", "elph"]
categories = ["command-line-utilities", "gui"]
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = true

[lib]
name = "elph_tui"
path = "src/lib.rs"

[dependencies]
anstyle-syntect.workspace = true
anstyle.workspace = true
anyhow.workspace = true
chrono.workspace = true
clipboard-rs.workspace = true
figlet-rs.workspace = true
html-escape.workspace = true
iocraft.workspace = true
linkify.workspace = true
log.workspace = true
memchr.workspace = true
pulldown-cmark.workspace = true
qrcode.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
# iocraft `use_future` runs on smol; use smol timers so mock tests (no Tokio RT) work.
smol = "2.0.2"
supports-color.workspace = true
syntect.workspace = true
textwrap.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
two-face.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true

# Wayland clipboard backend (Linux). macOS/Windows use platform-native APIs.
[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { workspace = true, features = ["wayland"] }
[dev-dependencies]
futures.workspace = true
lipsum = "0.9.1"
macro_rules_attribute = "0.2.0"
mexprp = { version = "0.3.1", default-features = false }
smol-macros = "0.1.1"

