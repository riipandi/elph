[package]
name = "floppy"
version = "0.0.1"
license = "MIT"
description = "Agent memory + semantic code index library (Turso), embeddable or standalone"
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = true
readme = "README.md"
keywords = ["ai", "memory", "vector", "codegraph", "sqlite"]
categories = ["database", "development-tools"]

[lib]
name = "floppy"
path = "src/lib.rs"

[features]
# Library defaults: memory domain on, heavy parsers off.
default = ["memory"]
# Task-scoped agent memory (memelord-compatible design).
memory = []
# Local ONNX / Candle embeddings via embed_anything.
embed = ["dep:embed_anything", "embed_anything/accelerate"]
# GPU acceleration (optional, requires matching hardware):
# - metal: Apple Silicon GPU (macOS)
# - cuda: NVIDIA GPU (Linux/Windows)
metal = ["embed", "embed_anything/metal"]
cuda = ["embed", "embed_anything/cuda"]
# Semantic codebase index (ast-grep chunking + FTS/vector). Optional; heavy.
codegraph = ["dep:ast-grep-core", "dep:ast-grep-language", "dep:ignore", "dep:sha2", "dep:regex", "dep:rayon", "dep:log"]
# Convenience: full surface for hosts (Elph).
full = ["memory", "embed", "codegraph"]

[dependencies]
anyhow.workspace = true
ast-grep-core = { version = "0.45.0", optional = true }
log = { workspace = true, optional = true }
ast-grep-language = { version = "0.45.0", default-features = false, optional = true, features = [
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-c-sharp",
  "tree-sitter-elixir",
  "tree-sitter-go",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
] }
chrono.workspace = true
embed_anything = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
kalid.workspace = true
memorable-ids.workspace = true
parking_lot.workspace = true
rand.workspace = true
rayon = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
turso.workspace = true
turso-db.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
linker_messages = "allow"
