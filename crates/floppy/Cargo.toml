[package]
name = "floppy"
version = "0.0.1"
license = "MIT"
description = "AI memory with vector search powered by Turso"
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = true

[lib]
name = "floppy"
path = "src/lib.rs"

[features]
default = []
embed = ["dep:embed_anything"]
# Semantic codebase index (chunking via ast-grep + FTS/vector). Optional; heavy parsers.
codegraph = [
  "dep:ast-grep-core",
  "dep:ast-grep-language",
  "dep:ignore",
  "dep:sha2",
  "dep:regex",
]

[dependencies]
anyhow.workspace = true
ast-grep-core = { version = "0.45.0", optional = true }
ast-grep-language = { version = "0.45.0", default-features = false, optional = true, features = [
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-c-sharp",
  "tree-sitter-elixir",
  "tree-sitter-go",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
] }
chrono.workspace = true
embed_anything = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
kalid.workspace = true
memorable-ids.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
turso.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
linker_messages = "allow"
